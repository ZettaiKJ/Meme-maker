<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Maker</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-2: #374151;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --accent: #f59e0b;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1f2937, var(--bg) 50%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        width: min(1100px, 96vw);
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.45);
        backdrop-filter: blur(10px);
        display: grid;
        grid-template-columns: 340px 1fr;
        overflow: hidden;
      }

      .sidebar {
        background: rgba(17, 24, 39, 0.9);
        padding: 24px 20px;
        border-right: 1px solid rgba(255,255,255,0.08);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 1.8rem;
      }

      .group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 8px;
      }

      input[type="text"],
      input[type="range"],
      select,
      button {
        width: 100%;
      }

      input[type="text"],
      select {
        padding: 11px 12px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        background: rgba(255,255,255,0.05);
        color: var(--text);
        font-size: 1rem;
      }

      input[type="range"] {
        accent-color: var(--accent);
      }

      .row {
        display: flex;
        gap: 10px;
      }

      .row > * { flex: 1; }

      button {
        border: none;
        padding: 12px 14px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }

      button:active { transform: translateY(0); }

      .primary {
        background: linear-gradient(135deg, #f59e0b, #f97316);
        color: #111827;
      }

      .secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
      }

      .tertiary {
        background: #2563eb;
        color: white;
      }

      .color-wrap {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      input[type="color"] {
        width: 56px;
        height: 42px;
        border: none;
        background: transparent;
        border-radius: 10px;
        overflow: hidden;
        padding: 0;
      }

      .stage-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px;
        background: linear-gradient(145deg, rgba(31, 41, 55, 0.8), rgba(17, 24, 39, 0.9));
      }

      .canvas-shell {
        width: min(72vw, 720px);
        aspect-ratio: 1;
        border-radius: 18px;
        background: rgba(255,255,255,0.04);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), 0 20px 45px rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      canvas {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background: #0f172a;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Meme Maker</h1>

        <div class="group">
          <label for="topText">Top text</label>
          <input id="topText" type="text" value="WHEN THE CODE" maxlength="26" />
        </div>

        <div class="group">
          <label for="bottomText">Bottom text</label>
          <input id="bottomText" type="text" value="ACTUALLY WORKS" maxlength="26" />
        </div>

        <div class="group">
          <label for="fontSize">Text size</label>
          <input id="fontSize" type="range" min="40" max="120" value="72" />
        </div>

        <div class="group">
          <label>Text color</label>
          <div class="color-wrap">
            <input id="textColor" type="color" value="#ffffff" />
            <span id="colorValue">#ffffff</span>
          </div>
        </div>

        <div class="group">
          <label for="template">Template</label>
          <select id="template">
            <option value="classic">Classic</option>
            <option value="sunset">Sunset</option>
            <option value="neon">Neon</option>
            <option value="retro">Retro</option>
            <option value="space">Space</option>
          </select>
        </div>

        <div class="group row">
          <button class="secondary" id="randomBtn" type="button">Random</button>
          <button class="primary" id="renderBtn" type="button">Update</button>
        </div>

        <div class="group row">
          <button class="secondary" id="uploadBtn" type="button">Upload image</button>
          <input id="imageUpload" type="file" accept="image/*" hidden />
        </div>

        <div class="group">
          <button class="tertiary" id="downloadBtn" type="button">Download PNG</button>
        </div>
      </aside>

      <main class="stage-wrap">
        <div class="canvas-shell">
          <canvas id="memeCanvas" width="720" height="720"></canvas>
        </div>
      </main>
    </div>

    <script>
      const canvas = document.getElementById('memeCanvas');
      const ctx = canvas.getContext('2d');

      const topTextInput = document.getElementById('topText');
      const bottomTextInput = document.getElementById('bottomText');
      const fontSizeInput = document.getElementById('fontSize');
      const textColorInput = document.getElementById('textColor');
      const colorValue = document.getElementById('colorValue');
      const templateSelect = document.getElementById('template');
      const imageUpload = document.getElementById('imageUpload');
      const uploadBtn = document.getElementById('uploadBtn');

      const templates = {
        classic: {
          bg1: '#1d4ed8',
          bg2: '#7c3aed',
          accent: '#fbbf24'
        },
        sunset: {
          bg1: '#f97316',
          bg2: '#ef4444',
          accent: '#fff7ed'
        },
        neon: {
          bg1: '#00c2ff',
          bg2: '#7c3aed',
          accent: '#ecfeff'
        },
        retro: {
          bg1: '#facc15',
          bg2: '#f59e0b',
          accent: '#111827'
        },
        space: {
          bg1: '#020617',
          bg2: '#312e81',
          accent: '#c4b5fd'
        }
      };

      const randomTexts = [
        ['ME', 'WHEN THE BUG IS FIXED'],
        ['I TOLD THEM', 'IT WAS EASY'],
        ['FINALLY', 'UNDERSTANDING THE CODE'],
        ['PRO CRASTINATOR', 'IN THE LAST HOUR'],
        ['SOMETHING', 'WORKS ON THE FIRST TRY'],
        ['DAY ONE', 'DAY 100'],
        ['MIDDLE OF THE NIGHT', '“I HAVE AN IDEA”'],
        ['THEY SAID', 'WE CAN DO IT'],
        ['LITTLE DOING', 'BIG RESULTS'],
        ['POV', 'AFTER A SUCCESSFUL PUSH']
      ];

      let uploadedImage = null;

      function updateColorLabel() {
        colorValue.textContent = textColorInput.value;
      }

      function drawBackground() {
        const choice = templates[templateSelect.value] || templates.classic;
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, choice.bg1);
        gradient.addColorStop(1, choice.bg2);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 0; i < 14; i++) {
          ctx.beginPath();
          ctx.arc(
            (i * 70 + 40) % canvas.width,
            (i * 90 + 60) % canvas.height,
            18 + (i % 4) * 12,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        const accent = choice.accent;
        ctx.fillStyle = accent + '22';
        ctx.fillRect(30, 30, canvas.width - 60, canvas.height - 60);
      }

      function drawUploadedImage() {
        if (!uploadedImage) return;
        const img = uploadedImage;
        const maxSize = 560;
        const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        const drawWidth = img.width * scale;
        const drawHeight = img.height * scale;
        const x = (canvas.width - drawWidth) / 2;
        const y = (canvas.height - drawHeight) / 2 + 30;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, drawWidth, drawHeight, 18);
        ctx.clip();
        ctx.drawImage(img, x, y, drawWidth, drawHeight);
        ctx.restore();
      }

      function strokeText(text, x, y, size, color) {
        ctx.save();
        ctx.font = `900 ${size}px Impact, Arial Black, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(4, size * 0.12);
        ctx.strokeStyle = 'rgba(0,0,0,0.9)';
        ctx.fillStyle = color;
        ctx.strokeText(text.toUpperCase(), x, y);
        ctx.fillText(text.toUpperCase(), x, y);
        ctx.restore();
      }

      function drawText() {
        const topText = topTextInput.value.trim() || 'TOP TEXT';
        const bottomText = bottomTextInput.value.trim() || 'BOTTOM TEXT';
        const size = Number(fontSizeInput.value) || 72;
        const color = textColorInput.value;

        strokeText(topText, canvas.width / 2, 110, size, color);
        strokeText(bottomText, canvas.width / 2, canvas.height - 100, size, color);
      }

      function renderMeme() {
        drawBackground();
        drawUploadedImage();
        drawText();
      }

      function randomizeMeme() {
        const pair = randomTexts[Math.floor(Math.random() * randomTexts.length)];
        topTextInput.value = pair[0];
        bottomTextInput.value = pair[1];
        const templateNames = Object.keys(templates);
        templateSelect.value = templateNames[Math.floor(Math.random() * templateNames.length)];
        textColorInput.value = ['#ffffff', '#fef3c7', '#dbeafe', '#fbcfe8', '#d1fae5'][Math.floor(Math.random() * 5)];
        updateColorLabel();
        fontSizeInput.value = String(60 + Math.floor(Math.random() * 24));
        renderMeme();
      }

      function handleUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            uploadedImage = img;
            renderMeme();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function downloadMeme() {
        const link = document.createElement('a');
        link.download = 'meme.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      topTextInput.addEventListener('input', renderMeme);
      bottomTextInput.addEventListener('input', renderMeme);
      fontSizeInput.addEventListener('input', renderMeme);
      textColorInput.addEventListener('input', () => {
        updateColorLabel();
        renderMeme();
      });
      templateSelect.addEventListener('change', renderMeme);
      document.getElementById('renderBtn').addEventListener('click', renderMeme);
      document.getElementById('randomBtn').addEventListener('click', randomizeMeme);
      uploadBtn.addEventListener('click', () => imageUpload.click());
      imageUpload.addEventListener('change', handleUpload);
      document.getElementById('downloadBtn').addEventListener('click', downloadMeme);

      updateColorLabel();
      renderMeme();
    </script>
  </body>
</html>
